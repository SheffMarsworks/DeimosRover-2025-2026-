diff_to_velocity:
  ros__parameters:
    cmd_vel_topic: /diff_drive_controller/cmd_vel
    velocity_command_topic: /velocity_controller/commands

    # Match these to your rover/wheel geometry.
    wheel_radius: 0.10
    wheel_separation: 0.50

    # Current motor joint velocity limit from ak45.urdf.xacro.
    max_wheel_velocity: 5.44

    # Output order is: [motor_1, motor_2, motor_3, motor_4]
    # Default signs match your manual forward test:
    # ros2 topic pub /velocity_controller/commands ... "{data: [0.5, -0.5, 0.5, 0.5]}"
    # If a wheel spins the wrong way, change only its sign.
    motor_signs: [1.0, -1.0, 1.0, 1.0]

    publish_rate: 50.0
    cmd_timeout: 0.5
    linear_deadband: 0.0
    angular_deadband: 0.0
